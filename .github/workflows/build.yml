name: Build Windows EXE

'on':
  push:
    branches:
      - main
      - master
      - refactor/modular-structure
      - 'refactor/*'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-pyinstaller:
    name: Build with PyInstaller (Stable GUI)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 qasync asyncssh pyyaml ruamel.yaml pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller TA_DEPLOY_TOOL.spec

      - name: Upload PyInstaller Artifact
        uses: actions/upload-artifact@v6
        with:
          name: TA-DEPLOY-TOOL-PyInstaller
          path: dist/TA_DEPLOY_TOOL.exe

  build-nuitka:
    name: Build with Nuitka
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 qasync asyncssh pyyaml ruamel.yaml nuitka zstandard

      - name: Build EXE with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --plugin-enable=pyside6 `
            --include-qt-plugins=sensible,platforms `
            --include-package=qasync `
            --include-package=asyncssh `
            --include-package=yaml `
            --include-package=ruamel `
            --include-data-files=config.template.yaml=config.template.yaml `
            --include-data-dir=assets=assets `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --output-filename=TA-DEPLOY-TOOL.exe `
            main.py

      - name: Upload Nuitka Artifact
        uses: actions/upload-artifact@v6
        with:
          name: TA-DEPLOY-TOOL-Nuitka
          path: TA-DEPLOY-TOOL.exe
