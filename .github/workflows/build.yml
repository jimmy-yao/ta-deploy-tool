name: Build Windows EXE (Nuitka)

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 qasync asyncssh pyyaml nuitka zstandard

      - name: Build EXE with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --plugin-enable=pyside6 `
            --include-package=qasync `
            --include-package=asyncssh `
            --include-package=yaml `
            --include-data-files=config.template.yaml=config.template.yaml `
            --include-data-dir=assets=assets `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --output-filename=TA-DEPLOY-TOOL.exe `
            main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TA-DEPLOY-TOOL-Nuitka
          path: TA-DEPLOY-TOOL.exe
