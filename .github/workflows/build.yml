name: Build Windows EXE

    on:
      push:
        tags:
          - 'v*'
      workflow_dispatch:

    jobs:
      build:
        runs-on: windows-latest  # 使用云端 Windows 节点构建
        steps:
          - uses: actions/checkout@v3

          - name: Set up Python
            uses: actions/setup-python@v4
            with:
              python-version: '3.10'

          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install PySide6 qasync asyncssh pyyaml pyinstaller

          - name: Build EXE
            run: |
              pyinstaller --noconsole --onefile --name="TA-DEPLOY-TOOL" main.py

          - name: Upload Artifact
            uses: actions/upload-artifact@v3
            with:
              name: TA-DEPLOY-TOOL-Windows
              path: dist/TA-DEPLOY-TOOL.exe
