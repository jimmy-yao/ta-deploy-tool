name: Build EXE (win / mac / linux)

# ───────────────────────────────────────────────────────────────
# artifact 配额（失败信息见下）：
#   Failed to CreateArtifact: Artifact storage quota has been hit.
# 私有仓库的 Actions 存储配额很小，三平台 PyInstaller + Nuitka 一轮
# 就约 180MB；历史运行攒下来的 artifact 很快把配额顶满，构建本身没
# 问题，却卡在最后一步 Upload artifact。
#
# 因此每次运行先跑 prune-artifacts，把**其它运行**留下的 artifact 全
# 删掉，只保留本次运行的产物，占用稳定在单轮体积；upload 上的
# retention-days 只是兜底（长期没有新推送时自动过期）。
#
# 上传失败不连坐构建：配额用量重算是 6–12 小时级别的延迟，删完也可能
# 暂时传不上去。普通推送里 Upload artifact 失败只算告警，构建/自检
# 通过即为绿；打 v* tag 发版时仍按失败处理，避免发布缺产物。
# ───────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────
# 三平台产物矩阵（私有仓库计费：ubuntu 1x / windows 2x / macos 10x）
#
#   PyInstaller · linux    1x   dist/TA_DEPLOY_TOOL        → .tar.gz
#   PyInstaller · windows  2x   dist/TA_DEPLOY_TOOL.exe    → 原样
#   PyInstaller · macos   10x   dist/TA_DEPLOY_TOOL.app    → ditto zip
#   Nuitka      · windows  2x   TA-DEPLOY-TOOL.exe         → 原样
#
# 为什么 linux / mac 不直接上传产物目录，要先 tar / ditto 打一层：
#   upload-artifact 打的 zip **不保证保留 Unix 可执行位和符号链接**。
#   丢可执行位 → linux 下载下来 Permission denied；
#   丢符号链接 → .app 里 Qt 的 dylib 链断掉，dyld 直接起不来。
#   tar 和 ditto 是各自平台的权威打包器，会把这些属性显式写进内层文件，
#   外层那个 zip 再怎么动都碰不到里面。代价只是用户多解一层。
#
# macOS 为什么不跟 win/linux 一样出单文件：见 TA_DEPLOY_TOOL.spec 顶部注释
# （BUNDLE 包 onefile EXE 是 PyInstaller 的弃用路径）。
# ───────────────────────────────────────────────────────────────

'on':
  push:
    branches:
      - main
      - master
      - refactor/modular-structure
      - 'refactor/*'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 先清历史产物再构建：配额是账户级的，删不动就等于后面所有 upload 全失败。
  # 只保留本次运行（KEEP_RUN）的 artifact，历史运行的一律删除。
  prune-artifacts:
    name: Prune old artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 删除历史产物（只保留本次运行）
        shell: bash
        # 清理失败不应连坐构建：配额没清掉时 upload 会自己报错，比直接
        # 卡在 needs 上更容易看出根因
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # 先收集完再删：边翻页边删会让 Link 头里的分页位置失效，漏删旧产物
          ids=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" |
            jq -r --argjson keep "$KEEP_RUN" \
              '.artifacts[] | select(.workflow_run.id != $keep) | .id')
          while read -r id; do
            [ -n "$id" ] || continue
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1; then
              echo "deleted artifact $id"
            else
              echo "::warning::删除 artifact $id 失败（忽略，不影响构建）"
            fi
          done <<< "$ids"

  pyinstaller:
    name: PyInstaller · ${{ matrix.name }}
    needs: prune-artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      # 一台挂了不要连坐取消另外两台 —— 三个平台的失败原因通常互不相干
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            build: dist/TA_DEPLOY_TOOL
            upload: dist/TA_DEPLOY_TOOL.tar.gz
          - name: windows
            os: windows-latest
            build: dist/TA_DEPLOY_TOOL.exe
            upload: dist/TA_DEPLOY_TOOL.exe
          - name: macos
            os: macos-latest
            build: dist/TA_DEPLOY_TOOL.app
            upload: dist/TA_DEPLOY_TOOL.app.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # Pillow 是构建依赖、不是运行依赖：macOS 的 .app 图标只有 .ico，
      # PyInstaller 要靠 Pillow 把它转成 .icns（不装的话 spec 里的
      # mac_bundle_icon() 会退回 PyInstaller 自带图标，不会失败）。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller Pillow

      - name: PyInstaller 打包
        run: pyinstaller --noconfirm TA_DEPLOY_TOOL.spec

      - name: 打 tar.gz（保可执行位）
        if: matrix.name == 'linux'
        shell: bash
        run: tar -C dist -czf dist/TA_DEPLOY_TOOL.tar.gz TA_DEPLOY_TOOL

      - name: 打 ditto zip（保可执行位 + 符号链接）
        if: matrix.name == 'macos'
        shell: bash
        run: ditto -c -k --keepParent dist/TA_DEPLOY_TOOL.app dist/TA_DEPLOY_TOOL.app.zip

      # 显式断言两级产物都在。pyinstaller 静默失败时 dist/ 会是空的，
      # 而 upload-artifact 默认只是 warning 不报错 —— 那样会上传一个空 artifact。
      - name: 产物自检
        shell: bash
        run: |
          ls -la dist
          test -e "${{ matrix.build }}" || { echo "::error::PyInstaller 未产出 ${{ matrix.build }}"; exit 1; }
          test -e "${{ matrix.upload }}" || { echo "::error::打包未产出 ${{ matrix.upload }}"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        # 配额是账户级的，用量重算有 6–12 小时延迟。普通推送里构建和自检
        # 通过就说明代码没问题，不该因为上传配额让整轮变红；只有打 tag
        # 发版时产物缺失才算真失败。
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: TA-DEPLOY-TOOL-pyinstaller-${{ matrix.name }}
          path: ${{ matrix.upload }}
          if-no-files-found: error
          # 兜底：长期没有新推送时自动过期，避免产物一直占配额
          retention-days: 7

  # ── Nuitka 只跑 Windows（Linux/macOS 上 PySide6 onefile 编译极慢，
  #    且 macOS 还要额外处理签名/工具链），按你的决定保留为 Windows 备选产物。──
  nuitka:
    name: Nuitka · windows
    needs: prune-artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 qasync asyncssh pyyaml ruamel.yaml nuitka zstandard

      # 默认 shell 是 pwsh，行尾反引号是 PowerShell 的续行符 —— 别改这步的 shell
      - name: Build EXE with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --plugin-enable=pyside6 `
            --include-qt-plugins=sensible,platforms `
            --include-package=qasync `
            --include-package=asyncssh `
            --include-package=yaml `
            --include-package=ruamel `
            --include-data-files=config.template.yaml=config.template.yaml `
            --include-data-dir=assets=assets `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --output-filename=TA-DEPLOY-TOOL.exe `
            main.py

      - name: 产物自检
        shell: bash
        run: |
          test -e TA-DEPLOY-TOOL.exe || { echo "::error::Nuitka 未产出 TA-DEPLOY-TOOL.exe"; exit 1; }
          ls -la TA-DEPLOY-TOOL.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        # 同 PyInstaller：非 tag 推送时上传失败只告警，不让整轮构建变红
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: TA-DEPLOY-TOOL-nuitka-windows
          path: TA-DEPLOY-TOOL.exe
          if-no-files-found: error
          retention-days: 7
