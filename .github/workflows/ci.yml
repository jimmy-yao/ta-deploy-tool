# Rust 分支的门禁 + 三平台产物。
#
# ══════════════════════════════════════════════════════════════════════
# 为什么这个文件里一个 Python / Go 步骤都没有（这是有意的）
# ══════════════════════════════════════════════════════════════════════
# 仓库里确实还躺着两套旧 workflow，但它们**够不着这个分支**：
#
#   origin/main                      .github/workflows/build.yml
#     push: [main, master] + tags v* + workflow_dispatch  → PyInstaller / Nuitka
#   origin/refactor/modular-structure .github/workflows/build.yml
#     push: [refactor/modular-structure, 'refactor/*']    → 同上（多一个通配）
#
# 看着 `refactor/*` 像会连累本分支，实际不会 —— GitHub 的规则是：
#   · `push` 事件只认**被推那个 ref 上存在的** workflow 文件。
#     `refactor/rust-rewrite` 上根本没有 build.yml，所以推这个分支时它压根不会被读到。
#   · `pull_request` 事件跑在 `refs/pull/N/merge`（head 并进 base 的合并提交）上，
#     所以本分支的 ci.yml 能在 PR 里跑；而 main / modular-structure 的 build.yml
#     **都没有 `pull_request` 触发器**，只有 push —— PR 也不会把它们带起来。
#   · `workflow_dispatch`（手动按钮）要求 workflow 文件在**默认分支**上，
#     而默认分支是 main，那里只有 build.yml。想在 UI 里手动触发本文件，
#     得先把它合进默认分支。
#
# 一句话：只推 `refactor/rust-rewrite`，就只会跑 Rust。下面的 `paths-ignore`
# 是第二道保险 —— 只动 Go / Python / 文档的提交干脆不触发，省分钟数。
#
# ── 三条实测结论（改之前先读）─────────────────────────────────────────
#
# ① 工具链不用装。`rust-toolchain.toml` 锁 1.98.1 并列了 rustfmt / clippy，
#    runner 上的 rustup 在 checkout 后第一次跑 cargo 就会自动装齐，
#    所以这里既没有 dtolnay/rust-toolchain 也不用 `rustup component add`。
#
# ② `Cargo.lock` 已跟踪（二进制项目必须跟踪）→ 一律加 `--locked`，上游依赖
#    发新版不会让 CI 无缘无故变红。全 workspace 无 `build.rs`，构建期不联网。
#    clippy 必须显式 `-D warnings` —— `--all-targets` 本身不会让警告变红，
#    本地那句「0 warning」靠的是人看输出，CI 里没人看。
#
# ③ ubuntu job **必须显式装 openssh-server**。`crates/deployer/tests` 要在本机
#    起一个 sshd，但它的策略是「起不来就 `eprintln!` 一句跳过然后 `return`」——
#    **测试照样算通过**。镜像里没有 sshd 的话，SSH 那层覆盖会悄悄掉光而 CI
#    依然全绿。装上它才会真跑。
#    （已实测：非 root 起 sshd + 私钥认证 + SFTP 子系统全通，不需要 sudo，
#     也不需要 /run/sshd —— 测试里那句 create_dir 只在 root 启动时才卡。）
#
# ④ Windows 专属 cfg 的代码，Linux 上**根本不会被编译**，clippy 是瞎的。
#    第一次 CI 就在这上面翻了两次车，都是只在 Windows 才有的错：
#      · `crates/config/src/detect.rs`  winreg 0.56 的 enum_keys() 直接返回
#        迭代器，我却写了 `let Ok(..) = .. else` → E0308
#      · `crates/ui/src/lib.rs`         edition 2024 要求 `unsafe extern`
#      · 另有 3 个 `unused import / unused variable`（只有 #[cfg(unix)] 分支才用得到）
#    所以 windows job 里先跑一遍 clippy 再 build —— 否则「clippy 零警告」
#    这条标准在 Windows 代码上形同虚设。
#
#    **本地就能提前抓到，不必等 CI**（交叉编译不链接，不需要 MSVC）：
#      apt-get install -y gcc-mingw-w64-x86-64 nasm     # aws-lc-sys 要编 C 和 x86 汇编
#      rustup target add x86_64-pc-windows-gnu
#      cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
#    ⚠ 必须跑 **clippy 且带 -D warnings**，跑 `cargo check` 是不够的 ——
#      check 只查类型、不含 lint，而 CI 这一步就是 clippy。第二轮 CI 就是
#      在 check 全绿的情况下被 clippy::collapsible_if 拦下的。
#    ⚠ 用 `x86_64-pc-windows-msvc` 是**不行**的：aws-lc-sys 明确拒绝
#      "GNU compiler is not supported for this target"，而本机没有 MSVC。
#
# ── 成本（私有仓库：ubuntu 1x / windows 2x / **macos 10x**，Free 每月 2000）
#
#   build 矩阵三台并行是最大的开销项。mac 那台尤其贵。
#   要省：把 macos 那行删掉，或者给 build 加 `needs: gates`（门禁挂了就不开
#   三台机器，代价是拿不到产物）。默认没加，为的是门禁和构建并行、尽快出件。
#
# ── 本地复现（顺序即 gates job 里的顺序，先跑便宜的）──────────────────
#   cargo fmt --all --check
#   python3 scripts/check_layering.py
#   cargo clippy --workspace --all-targets --locked -- -D warnings
#   cargo test  --workspace --locked
#
# 注意 check_layering.py 是**Rust 门禁的一部分**，不是 Python 构建 ——
# 它只是用 cargo metadata 断言 crate 依赖方向，跑完就退出，不产出任何东西。

name: CI

on:
  push:
    branches: ["**"]
    # 只动这些路径的提交不触发（改了 crates/、Cargo.*、config.template.yaml、
    # scripts/、assets/ 的照常触发）。
    # ⚠ 如果配了分支保护要求 status check，纯文档 PR 会因为「没有检查可报」
    #   而卡住合并 —— 那种情况把 `**.md` 和 `docs/**` 这两行删掉。
    paths-ignore:
      # Python（已归档，不参与本分支构建）
      - "legacy-python/**"
      # Go（源码留在仓库里仅供对照，不是本分支的构建目标）
      - "cmd/**"
      - "internal/**"
      - "ui/**" # 顶层 ui/ 是 Go Fyne；Rust 的在 crates/ui/，不受影响
      - "go.mod"
      - "go.sum"
      - "embed.go"
      - "embed_test.go"
      - "stdio_android.go"
      - "stdio_other.go"
      # 文档
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

# 同一 ref 上的新 push 取消上一次还在跑的 —— 省分钟数的最有效手段
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只读：CI 不需要写仓库的权限
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------
  # 四道门禁（全部是 Rust）。这是这个分支唯一的"正确性"信号。
  # ------------------------------------------------------------------
  gates:
    name: 门禁 · linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 必须装，理由见文件头 ③。漏了这步 deployer 的 SSH 集成测试会静默跳过。
      - name: 装 openssh-server（deployer 集成测试要起本机 sshd）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server

      # 第三方 action，只做 target/ 缓存，删掉只是变慢、不影响正确性。
      - uses: Swatinem/rust-cache@v2

      # —— 便宜的先跑，快速失败 ——
      - name: 格式检查
        run: cargo fmt --all --check

      - name: 分层断言（Cargo 没有 internal/，边界靠这个脚本）
        run: python3 scripts/check_layering.py

      - name: clippy（警告即错误）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 测试
        run: cargo test --workspace --locked

      # 无窗口路径冒烟：-v 不需要显示器，用来确认 bin 真的链接出来了。
      # 注意 `--check` 对 config.template.yaml 是**预期失败**（退出码 1，
      # 只报 Maven 路径），不能拿它的退出码当断言。
      - name: 冒烟
        run: cargo run --locked -p ta-deploy-tool-cli -- --version

  # ------------------------------------------------------------------
  # 三平台 release 构建 → 单 exe 产物。三台并行。
  #
  # 这里只 build、不 test：测试已经在 gates 上跑过，而 test 走 debug profile、
  # build 走 release profile，**两者是两套完全独立的编译**，矩阵里再跑一遍
  # test 会让每台机器的时间翻倍（mac 那台按 10x 计费）。
  # 要跨平台单测的话，把下面那行注释放开即可。
  # ------------------------------------------------------------------
  build:
    name: 构建 · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # 一台挂了不连累另外两台 —— 三个平台要各自报错
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            bin: deploytool
          - name: windows
            os: windows-latest
            bin: deploytool.exe
          - name: macos
            os: macos-latest # Apple Silicon（arm64）
            bin: deploytool
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      # Windows 专属 cfg 的 clippy —— 理由见文件头 ④。放在 build 之前，
      # 让这类错快速失败，不必等 release 编完才看见。
      # 代价是多一次 debug profile 编译；嫌贵删掉这步即可，但那样
      # `#[cfg(windows)]` 里的警告就没人管了（errors 仍会被 build 抓到）。
      # `if` 限定在 windows：另外两台跑了也只是重复 gates 的活，
      # 而 macos 按 10x 计费，白烧没意义（仓库里没有 target_os = "macos"
      # 专属代码，`#[cfg(unix)]` 那些 Linux 的 clippy 已经覆盖到）。
      - name: clippy（Windows 专属 cfg）
        if: matrix.name == 'windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: release 构建
        run: cargo build --release --locked

      # 想要跨平台单测就把这行放开（会额外编一次 debug profile）：
      # - name: 测试（单测；deployer/builder 是 #![cfg(unix)]，Windows 上不编译）
      #   run: cargo test --workspace --locked

      # 产物名用**运行时真实的 host 三元组**，而不是写死。
      # 好处：macos-latest 哪天换了架构、或者 runner 镜像换代，文件名自动跟着变，
      # 不会出现「标着 aarch64 实际是 x86_64」这种误导。bash 在 windows-latest
      # 上由 Git Bash 提供，所以三台都能用同一步。
      # 写成块标量而不是单行：单行里 `s/^host: //p` 的「冒号+空格」会被 YAML
      # 当成映射分隔符，直接报 "mapping values are not allowed here"。
      - name: 取 host 三元组
        id: host
        shell: bash
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"

      # 产物只留 7 天，方便下载看一眼。要按 tag 发 Release 资产另建一个
      # workflow，别塞在这里 —— 门禁和发版的触发条件不一样。
      - uses: actions/upload-artifact@v7
        with:
          name: deploytool-${{ steps.host.outputs.triple }}
          path: target/release/${{ matrix.bin }}
          retention-days: 7
          if-no-files-found: error
