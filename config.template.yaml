maven: D:/apache-maven-3.9.6/bin/mvn.cmd

# JDK 根目录，用于 Maven 构建时注入 JAVA_HOME
# 留空则使用系统环境变量里的 JAVA_HOME
java_home: C:/Program Files/Java/jdk-17

workspace: D:/work
log_encoding: utf-8
backup_keep: 5
max_parallel_builds: 3
default_restart_script: bin/start.sh
auto_remote_name: false

# 重启命令执行失败时，自动把部署前的版本放回原位并重新重启一次
#   true  = 失败即回滚，服务尽量回到部署前状态（默认）
#   false = 只报错，线上文件保持新版本不动，由人工处理
auto_rollback: true

git:
  enabled: true
  branch_mode: iteration
  default_branch: main
  iteration_pattern: '^feature_(\d{8})_xc$'
  remote: origin
  strategy: reset
  fetch_timeout: 180
  ls_remote_timeout: 60
  # 构建用临时 git worktree：默认关闭，关闭时完全沿用原来的
  # 「在 project_dir 里 checkout/reset 后构建」行为。
  worktree:
    enabled: false
    # 留空 = <workspace>/worktrees；workspace 也为空则用系统临时目录
    root: ""
    # 每个仓库保留最近 N 个 commit 的 worktree；0 = 构建完立即删除
    keep: 3
    # 同 commit 复用已有目录，避免重复检出
    reuse: true
    # 有 .gitmodules 时自动初始化子模块
    submodules: true

environments:
  dev:
    default_server:
      host: 192.168.1.100
      port: 22
      user: deploy
      password: 'your-password'
    servers: {}
    services:
      example-service:
        project_dir: D:/work/example-service
        build_args: clean install -Dmaven.test.skip=true
        local_jar: ""
        remote_dir: /data/deploy/envs/tgfw-xc/example-service
        remote_name: ""
        depends_on: []
        # worktree 是干净检出，未入库的本地文件不会自动出现。
        # worktree: inherit       # inherit(默认) / on / off
        # worktree_copy:          # 按白名单从 project_dir 复制（相对路径）
        #   - .env
        #   - config/local.yml